<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin · 1 Percent Club</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0a0a0c">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@400;500;600&family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="desk.css">
</head>
<body>
<div class="gate" id="gate" role="status" aria-live="polite"><div class="inner"><span class="spin" aria-hidden="true"></span><p id="gateMsg">Opening admin…</p></div></div>
<div class="page">
<header class="bar"><div class="wrap">
  <a class="logo" href="index.html" aria-label="1 Percent Club home"><img src="1pc-logo.webp" alt="1 Percent Club" width="821" height="322"></a>
  <span class="eyebrow">Admin</span>
  <a class="back" href="account.html" style="margin-left:auto"><span>Member desk</span></a>
  <button class="btn btn-dark btn-sm" id="signOut" type="button">Sign out</button>
</div></header>
<nav class="rail" aria-label="Admin sections"><div class="wrap"><div class="rail-row" id="rail" role="tablist"><span class="rail-ink" id="railInk" aria-hidden="true"></span></div></div></nav>
<main class="rooms wrap" id="rooms"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
(async () => {
  const $ = (s, r = document) => r.querySelector(s), $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const pad2 = n => String(n).padStart(2, '0');
  const stop = html => { $('#gateMsg').innerHTML = html; $('.spin').hidden = true; };
  const cfg = window.ONEPC || {};
  if (!cfg.supabaseUrl || !cfg.supabaseKey || !window.supabase) return stop('The members database is not connected yet.');
  const sb = window.supabase.createClient(cfg.supabaseUrl, cfg.supabaseKey);
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { location.replace('login.html?next=admin.html'); return; }
  const me = (await sb.from('profiles').select('is_admin').eq('id', session.user.id).single()).data;
  if (!me || !me.is_admin) return stop('This page is for the 1 Percent Club team only.<br><a href="account.html" style="color:var(--fg)">Go to your member desk</a>');
  $('#signOut').addEventListener('click', async () => { await sb.auth.signOut(); location.replace('login.html'); });

  const fmtD = d => new Date(d).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
  const fmtDT = d => new Date(d).toLocaleString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  const toast = m => { const t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 3200); };
  const must = r => { if (r.error) throw r.error; return r.data; };
  const PLANS = ['starter', 'pro', 'lifetime'], PLAN_NAME = { starter: 'Starter', pro: 'Pro', lifetime: 'Lifetime' };
  const secs = v => { const p = String(v || '').trim().split(':').map(Number); if (p.some(isNaN) || !v) return null; return p.reduce((a, x) => a * 60 + x, 0); };
  const mmss = s => s == null ? '' : `${Math.floor(s / 60)}:${pad2(s % 60)}`;
  const planOpts = sel => PLANS.map(p => `<option value="${p}"${p === sel ? ' selected' : ''}>${PLAN_NAME[p]}</option>`).join('');

  const A = { members: [], sessions: [], lessons: [], news: [], tickets: [], msgs: new Map() };
  const loaders = {
    members: async () => { A.members = must(await sb.from('profiles').select('*').order('created_at', { ascending: false })); },
    sessions: async () => { A.sessions = must(await sb.from('live_sessions').select('*').gte('starts_at', new Date(Date.now() - 30 * 864e5).toISOString()).order('starts_at')); },
    lessons: async () => { A.lessons = must(await sb.from('lessons').select('*').order('sort').order('created_at')); },
    news: async () => { A.news = must(await sb.from('announcements').select('*').order('created_at', { ascending: false })); },
    tickets: async () => { A.tickets = must(await sb.from('tickets').select('*').order('updated_at', { ascending: false })); A.msgs = new Map(A.tickets.map(t => [t.id, []]));
      if (A.tickets.length) must(await sb.from('ticket_messages').select('*').in('ticket_id', A.tickets.map(t => t.id)).order('created_at')).forEach(m => A.msgs.get(m.ticket_id)?.push(m)); }
  };
  const who = id => { const m = A.members.find(x => x.id === id); return m ? (m.full_name || m.email) + (m.full_name ? ` <small>${esc(m.email)}</small>` : '') : 'Member'; };
  let selTicket = null;

  const ROOMS = [['tickets', 'Support'], ['sessions', 'Live sessions'], ['lessons', 'Lessons'], ['news', 'News'], ['members', 'Members']];
  const V = {
    tickets() { const t = A.tickets.find(x => x.id === selTicket) || A.tickets.find(x => x.status === 'open') || A.tickets[0]; if (t) selTicket = t.id;
      const st = { open: ['Needs reply', 'v'], answered: ['Replied', 'g'], closed: ['Closed', 'n'] };
      return `<div class="room-head"><div><h2>Support</h2><p>${A.tickets.filter(x => x.status === 'open').length} ticket(s) waiting for a reply.</p></div></div>` + (A.tickets.length ? `<div class="support">
        <article class="p frame" style="padding:0;gap:0">${A.tickets.map(x => `<button class="tk" data-act="ticket" data-id="${x.id}" aria-current="${x.id === t.id}"><div class="p-h"><small>#${x.id} · ${esc(x.category)}</small><span class="pill ${st[x.status][1]}">${st[x.status][0]}</span></div><b>${esc(x.subject)}</b><small>${who(x.user_id).replace(/<small>.*<\/small>/, '')} · ${fmtD(x.updated_at)}</small></button>`).join('')}</article>
        <article class="p frame thread"><div class="thread-h"><span class="lbl">#${t.id} · ${esc(t.category)} · from ${who(t.user_id)}</span><h3>${esc(t.subject)}</h3>
          <div class="row">${t.status === 'closed' ? `<button class="btn btn-dark btn-sm" data-act="status" data-id="open">Reopen</button>` : `<button class="btn btn-dark btn-sm" data-act="status" data-id="closed">Close ticket</button>`}</div></div>
          <div class="msgs" id="msgs">${(A.msgs.get(t.id) || []).map(m => m.is_staff ? `<div class="msg me">${esc(m.body)}<small>You · ${fmtDT(m.created_at)}</small></div>` : `<div class="msg admin"><span class="who">Member</span>${esc(m.body)}<small>${fmtDT(m.created_at)}</small></div>`).join('')}</div>
          <form class="compose" id="reply"><input id="replyIn" placeholder="Reply as 1 Percent Club support" aria-label="Reply" autocomplete="off" maxlength="4000"><button class="btn btn-red btn-sm" type="submit">Send reply</button></form></article></div>`
        : `<article class="p frame"><p class="note">No tickets yet.</p></article>`); },
    sessions() { const now = Date.now();
      return `<div class="room-head"><div><h2>Live sessions</h2><p>Times are entered in your local time and shown to each member in theirs.</p></div></div><div class="admin-grid">
        <article class="p frame"><span class="lbl red">Add a session</span><form class="admin-form" id="sessionForm" novalidate>
          <label for="sTitle">Title<input class="field-in" id="sTitle" maxlength="140" placeholder="London Open, live"></label>
          <div class="two"><label for="sKind">Type<select id="sKind"><option>Live</option><option>Class</option><option>Q&amp;A</option></select></label><label for="sPlan">Who can join<select id="sPlan">${planOpts('starter')}</select></label></div>
          <div class="two"><label for="sStart">Starts<input class="field-in" id="sStart" type="datetime-local"></label><label for="sMins">Minutes<input class="field-in" id="sMins" type="number" min="5" max="600" value="60"></label></div>
          <label for="sHost">Host<input class="field-in" id="sHost" value="The 1 Percent Club desk" maxlength="80"></label>
          <div class="two"><label for="sSeats">Seats (optional)<input class="field-in" id="sSeats" type="number" min="0"></label><label for="sUrl">Join link (Zoom, Meet, YouTube…)<input class="field-in" id="sUrl" type="url" placeholder="https://"></label></div>
          <button class="btn btn-red btn-sm" type="submit" style="justify-self:start">Add session</button></form></article>
        <article class="p frame"><span class="lbl">Scheduled</span>${A.sessions.length ? `<div class="table-wrap"><table class="admin-table"><thead><tr><th>When</th><th>Session</th><th>Who</th><th class="r"></th></tr></thead><tbody>${A.sessions.map(s => `<tr style="${new Date(s.starts_at) < now ? 'opacity:.5' : ''}"><td class="n">${fmtDT(s.starts_at)}<small>${s.duration_mins} min</small></td><td>${esc(s.title)}<small>${esc(s.kind)} · ${esc(s.host)}${s.join_url ? ' · link set' : ' · no link yet'}</small></td><td>${PLAN_NAME[s.required_plan]}+</td><td class="r"><button class="x" data-act="delSession" data-id="${s.id}">Delete</button></td></tr>`).join('')}</tbody></table></div>` : '<p class="note">Nothing scheduled.</p>'}</article></div>`; },
    lessons() {
      return `<div class="room-head"><div><h2>Lessons and ebooks</h2><p>Publishing puts a lesson in every member's Library and on the home page, marks it NEW on their desks for a week and adds it to their notifications. Drafts stay hidden.</p></div></div><div class="admin-grid">
        <article class="p frame"><span class="lbl red">Add a lesson or ebook</span><form class="admin-form" id="lessonForm" novalidate>
          <div class="two"><label for="lKind">Type<select id="lKind"><option value="video">Video</option><option value="ebook">Ebook</option></select></label><label for="lPlan">Who can open it<select id="lPlan">${planOpts('starter')}</select></label></div>
          <label for="lTitle">Title<input class="field-in" id="lTitle" maxlength="140"></label>
          <label for="lDesc">Short description<input class="field-in" id="lDesc" maxlength="300"></label>
          <div class="two"><label for="lCat">Topic<input class="field-in" id="lCat" placeholder="Price action" maxlength="40"></label><label for="lLevel">Level<select id="lLevel"><option>Beginner</option><option>Intermediate</option><option>Advanced</option><option>All levels</option></select></label></div>
          <div class="two"><label for="lStage">Stage<select id="lStage"><option value="">—</option><option value="1">01 Foundations</option><option value="2">02 Price action</option><option value="3">03 Strategy &amp; risk</option><option value="4">04 1% Trader</option></select></label><label for="lLen">Length (mm:ss) or pages<input class="field-in" id="lLen" placeholder="18:42 or 64"></label></div>
          <label for="lUrl">Video or file link (YouTube, Vimeo, Google Drive, or a direct .mp4 / .pdf link)<input class="field-in" id="lUrl" type="url" placeholder="https://youtu.be/…"></label>
          <label for="lCover">Cover / thumbnail image link (optional)<input class="field-in" id="lCover" type="url" placeholder="https://"></label>
          <label class="check" for="lPub"><input type="checkbox" id="lPub" checked> Publish now (members see it straight away)</label>
          <label class="check" for="lAnn"><input type="checkbox" id="lAnn" checked> Tell members: post a "New video / New ebook" item to every desk's news</label>
          <button class="btn btn-red btn-sm" type="submit" style="justify-self:start">Add</button></form></article>
        <article class="p frame"><div class="p-h"><span class="lbl">Library</span><label class="check" for="autoAnn" style="font-size:13px"><input type="checkbox" id="autoAnn" ${autoAnn() ? 'checked' : ''}> Announce when I switch a draft to Live</label></div>${A.lessons.length ? `<div class="table-wrap"><table class="admin-table"><thead><tr><th>Title</th><th>Type</th><th>Who</th><th>Status</th><th class="r"></th></tr></thead><tbody>${A.lessons.map(l => `<tr><td>${esc(l.title)}<small>${esc([l.category, l.level, l.stage ? 'Stage ' + pad2(l.stage) : '', l.kind === 'video' ? mmss(l.duration_secs) : l.pages ? l.pages + ' pages' : ''].filter(Boolean).join(' · '))}${l.media_url ? '' : ' · no link yet'}</small></td><td>${l.kind === 'video' ? 'Video' : 'Ebook'}</td><td>${PLAN_NAME[l.required_plan]}+</td><td><button class="sw" role="switch" aria-checked="${l.published}" data-act="publish" data-id="${l.id}"><i></i>${l.published ? 'Live' : 'Draft'}</button></td><td class="r"><button class="x" data-act="delLesson" data-id="${l.id}">Delete</button></td></tr>`).join('')}</tbody></table></div>` : '<p class="note">No lessons yet.</p>'}</article></div>`; },
    news() {
      return `<div class="room-head"><div><h2>News from the desk</h2><p>Shows on every member's Today page, newest first.</p></div></div><div class="admin-grid">
        <article class="p frame"><span class="lbl red">Post news</span><form class="admin-form" id="newsForm" novalidate>
          <label for="nTag">Tag<select id="nTag"><option>News</option><option>New video</option><option>New ebook</option><option>Course</option><option>Schedule</option><option>Indicator</option></select></label>
          <label for="nTitle">Headline<input class="field-in" id="nTitle" maxlength="140"></label>
          <label for="nBody">Text<textarea class="field-in" id="nBody" rows="4" maxlength="2000" style="resize:vertical"></textarea></label>
          <button class="btn btn-red btn-sm" type="submit" style="justify-self:start">Post</button></form></article>
        <article class="p frame"><span class="lbl">Posted</span>${A.news.length ? `<div class="posts">${A.news.map(n => `<div class="post"><div class="row"><span class="pill n">${esc(n.tag)}</span><span class="when">${fmtD(n.created_at)}</span><button class="x" data-act="delNews" data-id="${n.id}" style="margin-left:auto">Delete</button></div><b>${esc(n.title)}</b><p class="note">${esc(n.body)}</p></div>`).join('')}</div>` : '<p class="note">Nothing posted yet.</p>'}</article></div>`; },
    members() {
      return `<div class="room-head"><div><h2>Members</h2><p>${A.members.length} member(s). Until online checkout is live, set a member's plan here after they pay.</p></div></div>
        <article class="p frame"><div class="table-wrap"><table class="admin-table"><thead><tr><th>Member</th><th>Joined</th><th>Plan</th><th>Cycle</th><th>Renews</th><th class="r"></th></tr></thead><tbody>${A.members.map(m => `<tr data-member="${m.id}"><td>${esc(m.full_name || '—')}<small>${esc(m.email)} · no. ${m.member_no}${m.is_admin ? ' · admin' : ''}</small></td><td class="n">${fmtD(m.created_at)}</td>
          <td><select aria-label="Plan" data-f="plan">${planOpts(m.plan)}</select></td><td><select aria-label="Billing cycle" data-f="cycle"><option value="">—</option><option value="monthly"${m.plan_cycle === 'monthly' ? ' selected' : ''}>Monthly</option><option value="yearly"${m.plan_cycle === 'yearly' ? ' selected' : ''}>Yearly</option></select></td>
          <td><input class="field-in" type="date" aria-label="Renews on" data-f="renews" value="${m.plan_renews_at ? m.plan_renews_at.slice(0, 10) : ''}" style="padding:8px"></td><td class="r"><button class="btn btn-dark btn-sm" data-act="setPlan" data-id="${m.id}">Save</button></td></tr>`).join('')}</tbody></table></div></article>`; }
  };

  const rail = $('#rail'), ink = $('#railInk'), rooms = $('#rooms'); let room = 'tickets';
  rail.insertAdjacentHTML('beforeend', ROOMS.map(([id, nm]) => `<button class="tab" role="tab" data-room="${id}" aria-selected="false">${nm}</button>`).join(''));
  function show(id) { room = id; $$('.tab', rail).forEach(t => t.setAttribute('aria-selected', String(t.dataset.room === id))); rooms.innerHTML = V[id]();
    const t = $(`.tab[data-room="${id}"]`); ink.style.left = t.offsetLeft + 'px'; ink.style.width = t.offsetWidth + 'px'; if (location.hash !== '#' + id) history.replaceState(null, '', '#' + id);
    const m = $('#msgs'); if (m) m.scrollTop = m.scrollHeight; }
  rail.addEventListener('click', async e => { const t = e.target.closest('.tab'); if (!t) return; try { await loaders[t.dataset.room](); } catch (err) { return toast('Could not load. Try again.'); } show(t.dataset.room); });

  async function act(fn, ok, reload) { try { await fn(); if (reload) await loaders[reload](); show(room); if (ok) toast(ok); } catch (e) { console.error(e); toast(e.message || 'That did not work. Try again.'); } }
  document.addEventListener('click', e => { const a = e.target.closest('[data-act]'); if (!a) return; const id = a.dataset.id;
    if (a.dataset.act === 'ticket') { selTicket = +id; show('tickets'); }
    if (a.dataset.act === 'status') act(async () => must(await sb.from('tickets').update({ status: id }).eq('id', selTicket)), id === 'closed' ? 'Ticket closed.' : 'Ticket reopened.', 'tickets');
    if (a.dataset.act === 'delSession' && confirmTwice(a)) act(async () => must(await sb.from('live_sessions').delete().eq('id', id)), 'Session deleted.', 'sessions');
    if (a.dataset.act === 'delLesson' && confirmTwice(a)) act(async () => must(await sb.from('lessons').delete().eq('id', id)), 'Deleted.', 'lessons');
    if (a.dataset.act === 'delNews' && confirmTwice(a)) act(async () => must(await sb.from('announcements').delete().eq('id', id)), 'Deleted.', 'news');
    if (a.dataset.act === 'publish') { const on = a.getAttribute('aria-checked') !== 'true', l = A.lessons.find(x => x.id === id), ann = on && autoAnn();
      act(async () => { must(await sb.from('lessons').update({ published: on }).eq('id', id)); if (ann && l) await announce(l.kind, l.title, l.description); },
        on ? (ann ? 'Published and announced to every member.' : 'Published: members can see it now.') : 'Moved back to draft.', 'lessons'); }
    if (a.dataset.act === 'setPlan') { const row = a.closest('tr'), plan = $('[data-f="plan"]', row).value, cycle = $('[data-f="cycle"]', row).value || null, d = $('[data-f="renews"]', row).value;
      if (plan === 'pro' && (!cycle || !d)) return toast('For Pro, choose Monthly or Yearly and a renewal date.');
      act(async () => must(await sb.rpc('admin_set_plan', { member: id, new_plan: plan, new_cycle: cycle, renews: d ? new Date(d + 'T23:59:00').toISOString() : null })), 'Plan saved.', 'members'); }
  });
  // announcements for new lessons land in every member's news and notifications
  const autoAnn = () => { try { return localStorage.getItem('1pc-autoAnn') !== '0'; } catch (e) { return true; } };
  document.addEventListener('change', e => { if (e.target.id === 'autoAnn') try { localStorage.setItem('1pc-autoAnn', e.target.checked ? '1' : '0'); } catch (err) {} });
  async function announce(kind, title, desc) {
    must(await sb.from('announcements').insert({ tag: kind === 'video' ? 'New video' : 'New ebook', title, body: desc || (kind === 'video' ? 'A new video lesson is in your Library.' : 'A new ebook is on your shelf.') }));
    try { await loaders.news(); } catch (e) {} }
  // deletes need a second click, so nothing disappears by accident
  function confirmTwice(btn) { if (btn.dataset.armed) return true; btn.dataset.armed = '1'; const t = btn.textContent; btn.textContent = 'Click again to delete'; setTimeout(() => { delete btn.dataset.armed; btn.textContent = t; }, 3000); return false; }

  document.addEventListener('submit', e => { const f = e.target; e.preventDefault();
    if (f.id === 'reply') { const body = $('#replyIn').value.trim(); if (!body) return;
      act(async () => must(await sb.from('ticket_messages').insert({ ticket_id: selTicket, body, is_staff: true })), 'Reply sent. The member sees it on their desk.', 'tickets'); }
    if (f.id === 'sessionForm') { const title = $('#sTitle').value.trim(), start = $('#sStart').value;
      if (title.length < 2 || !start) return toast('Add a title and a start time.');
      act(async () => must(await sb.from('live_sessions').insert({ title, kind: $('#sKind').value, required_plan: $('#sPlan').value, starts_at: new Date(start).toISOString(), duration_mins: +$('#sMins').value || 60,
        host: $('#sHost').value.trim() || 'The 1 Percent Club desk', seats: $('#sSeats').value === '' ? null : +$('#sSeats').value, join_url: $('#sUrl').value.trim() || null })), 'Session added. Members can see it now.', 'sessions'); }
    if (f.id === 'lessonForm') { const title = $('#lTitle').value.trim(), kind = $('#lKind').value, len = $('#lLen').value.trim();
      if (title.length < 2) return toast('Add a title.');
      act(async () => { must(await sb.from('lessons').insert({ kind, title, description: $('#lDesc').value.trim(), category: $('#lCat').value.trim(), level: $('#lLevel').value, stage: $('#lStage').value ? +$('#lStage').value : null,
        duration_secs: kind === 'video' ? secs(len) : null, pages: kind === 'ebook' && /^\d+$/.test(len) ? +len : null, media_url: $('#lUrl').value.trim() || null, cover_url: $('#lCover').value.trim() || null,
        required_plan: $('#lPlan').value, published: $('#lPub').checked, sort: A.lessons.length }));
        if ($('#lPub').checked && $('#lAnn').checked) await announce(kind, title, $('#lDesc').value.trim()); }, $('#lPub').checked ? ($('#lAnn').checked ? 'Published and announced to every member.' : 'Published: members can see it now.') : 'Added as a draft.', 'lessons'); }
    if (f.id === 'newsForm') { const title = $('#nTitle').value.trim(); if (title.length < 2) return toast('Add a headline.');
      act(async () => must(await sb.from('announcements').insert({ tag: $('#nTag').value, title, body: $('#nBody').value.trim() })), 'Posted.', 'news'); }
  });

  try { await Promise.all([loaders.members(), loaders.tickets()]); } catch (e) { console.error(e); return stop('Could not load admin data. <a href="" style="color:var(--fg)">Try again</a>.'); }
  const start = (location.hash || '').slice(1); if (V[start] && start !== 'tickets' && start !== 'members') await loaders[start]();
  show(V[start] ? start : 'tickets'); $('#gate').hidden = true;
})();
</script>
</body>
</html>
