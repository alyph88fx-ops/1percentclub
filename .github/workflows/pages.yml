# Publishes the site to GitHub Pages on every push to main, and hourly to refresh the economic calendar.
# One-time setup: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Build and publish run as separate jobs: publishing in the same job as the upload sometimes
  # ran before GitHub had registered the uploaded site ("Fetching artifact metadata failed").
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Collect site files
        run: |
          mkdir -p _site
          cp *.html *.webp *.jpg *.png *.ico *.svg *.js *.css .nojekyll _site/
          # index.html is written as a page body (it is also previewed on claude.ai, which supplies the
          # document head). Give the published copy its doctype, charset and mobile viewport.
          { printf '<!doctype html>\n<html lang="en">\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n'; cat index.html; } > _site/index.html
          if [ -f CNAME ]; then cp CNAME _site/; fi
      - name: Fetch this week's economic calendar (ForexFactory feed)
        run: |
          # One request per run. If the feed is unavailable the site falls back to its sample schedule.
          if curl -fsS --retry 2 --max-time 30 -A "1percentclub-site (GitHub Pages build)" \
               https://nfs.faireconomy.media/ff_calendar_thisweek.json -o calendar.json \
             && python3 -c "import json,sys; d=json.load(open('calendar.json')); sys.exit(0 if isinstance(d, list) else 1)"; then
            cp calendar.json _site/calendar.json
          else
            echo "Calendar feed unavailable; publishing without calendar.json"
          fi
      - name: Fetch real EUR/USD hourly candles (indicator demo)
        run: |
          python3 - <<'PY'
          import json, time, urllib.request
          try:
              req = urllib.request.Request('https://query1.finance.yahoo.com/v8/finance/chart/EURUSD=X?interval=1h&range=10d', headers={'User-Agent': 'Mozilla/5.0 (1percentclub-site build)'})
              r = json.load(urllib.request.urlopen(req, timeout=30))['chart']['result'][0]
              q, ts = r['indicators']['quote'][0], r['timestamp']
              bars = [[ts[i], round(q['open'][i], 5), round(q['high'][i], 5), round(q['low'][i], 5), round(q['close'][i], 5)]
                      for i in range(len(ts)) if None not in (q['open'][i], q['high'][i], q['low'][i], q['close'][i])]
              bars = [b for b in bars if b[0] % 3600 == 0][-120:]
              if len(bars) >= 30:
                  json.dump({'symbol': 'EURUSD', 'interval': '1h', 'updated': int(time.time()), 'bars': bars}, open('_site/eurusd-h1.json', 'w'), separators=(',', ':'))
                  print('EUR/USD bars:', len(bars))
          except Exception as e:
              print('EUR/USD candles unavailable this run:', e)
          PY
      # Gold (XAU/USD): record the spot price every run (hourly) and publish the last 48 hours as
      # xau-history.json for the home page's 24-hour change and sparkline. The cache carries the
      # history from one run to the next.
      - name: Restore gold price history
        uses: actions/cache/restore@v4
        with:
          path: xau-history.json
          key: xau-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: xau-
      - name: Record gold price (gold-api.com)
        run: |
          python3 - <<'PY'
          import json, time, urllib.request
          path = 'xau-history.json'
          try:
              hist = json.load(open(path))
          except Exception:
              hist = []
          try:
              req = urllib.request.Request('https://api.gold-api.com/price/XAU', headers={'User-Agent': '1percentclub-site (GitHub Pages build)'})
              price = float(json.load(urllib.request.urlopen(req, timeout=20))['price'])
              if price > 0:
                  hist.append({'t': int(time.time()), 'p': round(price, 2)})
          except Exception as e:
              print('Gold price unavailable this run:', e)
          cutoff = time.time() - 48 * 3600
          hist = [x for x in hist if x.get('t', 0) >= cutoff][-300:]
          json.dump(hist, open(path, 'w'), separators=(',', ':'))
          print('Gold history points:', len(hist))
          PY
          cp xau-history.json _site/xau-history.json
      - name: Save gold price history
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: xau-history.json
          key: xau-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
